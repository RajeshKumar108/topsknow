<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – TopsKnow Cybersecurity</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<!-- ===== NAVBAR ===== -->
<nav id="navbar">
  <div class="container">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">
        <div class="logo-icon">🛡</div>
        Tops<span>Know</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="courses.html">Courses</a></li>
      </ul>
      <button class="hamburger" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <div class="nav-actions"></div>
    </div>
  </div>
</nav>

<!-- ===== LOGIN FORM ===== -->
<main class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="shield-sm">🛡️</div>
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Sign in to your TopsKnow account</p>
    </div>

    <div id="alert-area"></div>

    <form class="auth-form" id="login-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="email">Email address</label>
        <input class="form-input" type="email" id="email" name="email"
               placeholder="you@example.com" autocomplete="email" required />
      </div>
      <div class="form-group">
        <label class="form-label" for="password" style="display:flex;justify-content:space-between">
          Password
          <a href="#" style="font-size:0.82rem;font-weight:400" onclick="forgotPassword(event)">Forgot password?</a>
        </label>
        <div class="input-wrap">
          <input class="form-input input-icon-right" type="password" id="password" name="password"
                 placeholder="Enter your password" autocomplete="current-password" required />
          <button type="button" class="input-icon-btn" onclick="togglePassword('password', this)" aria-label="Toggle password visibility">👁</button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-check">
          <input type="checkbox" id="remember-me" /> Keep me signed in for 30 days
        </label>
      </div>
      <button type="submit" class="btn btn-primary btn-full btn-lg" id="submit-btn">
        Sign In
      </button>
    </form>

    <div class="auth-divider">or continue with</div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <button class="btn btn-outline" onclick="socialLogin('Google', event)">
        <span>🔵</span> Google
      </button>
      <button class="btn btn-outline" onclick="socialLogin('GitHub', event)">
        <span>⚫</span> GitHub
      </button>
    </div>

    <div class="auth-footer">
      Don't have an account? <a href="register.html" style="font-weight:700">Sign up free →</a>
    </div>
  </div>
</main>

<script src="js/courses.js"></script>
<script src="js/app.js"></script>
<script>
  // Redirect if already logged in
  document.addEventListener('DOMContentLoaded', () => {
    if (Auth.isLoggedIn()) {
      window.location.href = 'dashboard.html';
    }
  });

  function isValidEmail(email) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email);
  }

  function showAlert(message, type = 'error') {
    const area = document.getElementById('alert-area');
    area.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
  }
  function clearAlert() {
    document.getElementById('alert-area').innerHTML = '';
  }

  function togglePassword(inputId, btn) {
    const input = document.getElementById(inputId);
    if (input.type === 'password') {
      input.type = 'text';
      btn.textContent = '🙈';
    } else {
      input.type = 'password';
      btn.textContent = '👁';
    }
  }

  function forgotPassword(e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    if (!email) {
      showAlert('Please enter your email address first, then click Forgot password.', 'info');
      document.getElementById('email').focus();
      return;
    }
    showAlert(`✅ Password reset link sent to <strong>${email}</strong>. Check your inbox.`, 'success');
  }

  function socialLogin(provider, event) {
    const btn = event.target.closest('button');
    btn.disabled = true;
    btn.innerHTML = `<span class="loader"></span> Connecting…`;
    setTimeout(() => {
      // Simulate OAuth flow – create a demo user
      const demoUser = {
        name: provider === 'Google' ? 'Google User' : 'GitHub User',
        email: `user@${provider.toLowerCase()}.com`,
        provider
      };
      Auth.login(demoUser);
      Toast.show(`✅ Signed in with ${provider}!`, 'success');
      setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);
    }, 1200);
  }

  document.getElementById('login-form').addEventListener('submit', function(e) {
    e.preventDefault();
    clearAlert();

    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    if (!email || !password) {
      showAlert('⚠️ Please fill in all fields.', 'error');
      return;
    }
    if (!isValidEmail(email)) {
      showAlert('⚠️ Please enter a valid email address.', 'error');
      return;
    }
    if (password.length < 6) {
      showAlert('⚠️ Password must be at least 6 characters.', 'error');
      return;
    }

    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="loader"></span> Signing in…';

    setTimeout(() => {
      // Demo: accept any valid-looking credentials
      const user = { name: email.split('@')[0].replace(/[^a-zA-Z0-9]/g,' ').trim() || 'Learner', email };
      Auth.login(user);
      Toast.show('✅ Welcome back! Redirecting to dashboard…', 'success');
      setTimeout(() => { window.location.href = 'dashboard.html'; }, 900);
    }, 1100);
  });
</script>
</body>
</html>
